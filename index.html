<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#ECE5D1; --paper-2:#E1D7BC; --card:#F7F1E3; --card-2:#F1E9D6;
  --ink:#3B2E22; --ink-soft:#6B5D4C; --line:rgba(59,46,34,.16); --line-strong:rgba(59,46,34,.32);
  --moss:#5E6A3E; --leaf:#7F8F55; --leaf-2:#98A672; --grass:#A9B47F; --grass-2:#97A36C;
  --a:#B0532C; --a-soft:#E2A98A; --b:#7B62A3; --b-soft:#C3AEDD;
  --ochre:#D29B3E; --pot:#BF7550; --pot-rim:#A4603F; --bloom:#C2593A; --lavbloom:#9A7FC4;
  --b1:#C9CFA8; --b2:#E3CDB1; --b3:#CBBEDB; --b4:#AFC0CC; --b5:#DCC48E;
  --sky:#E9E3CE; --ground:#9AA474; --window:#F8F2E4; --shade:rgba(60,70,30,.13);
  --cat-dark:#3A2F29; --cat-light:#F6EFE2; --cloud:#FBF8F1;
  --focus:#3F6B8F; --scene-dim:0;
  --body-font:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --display-font:"Young Serif",Georgia,"Times New Roman",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E2318; --paper-2:#262C1E; --card:#2A3122; --card-2:#313926;
    --ink:#EEE6D2; --ink-soft:#BDB39C; --line:rgba(238,230,210,.14); --line-strong:rgba(238,230,210,.3);
    --moss:#B3C28B; --leaf:#93A564; --leaf-2:#A9B97C; --grass:#3E4A2C; --grass-2:#4E5C36;
    --a:#E4936B; --a-soft:#7A4A33; --b:#B9A0E0; --b-soft:#56476F;
    --ochre:#E2B160; --pot:#B06A47; --pot-rim:#8E5236; --bloom:#E07A57; --lavbloom:#B49BE0;
    --b1:#4B553A; --b2:#5A4A39; --b3:#4A4260; --b4:#3D4B57; --b5:#5E5132;
    --sky:#232A1D; --ground:#4D5735; --window:#E9DFC8; --shade:rgba(0,0,0,.2);
    --cat-dark:#2A221E; --cat-light:#EDE3D0; --cloud:#D9D3C6;
    --focus:#9CC3E6; --scene-dim:.3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1E2318; --paper-2:#262C1E; --card:#2A3122; --card-2:#313926;
  --ink:#EEE6D2; --ink-soft:#BDB39C; --line:rgba(238,230,210,.14); --line-strong:rgba(238,230,210,.3);
  --moss:#B3C28B; --leaf:#93A564; --leaf-2:#A9B97C; --grass:#3E4A2C; --grass-2:#4E5C36;
  --a:#E4936B; --a-soft:#7A4A33; --b:#B9A0E0; --b-soft:#56476F;
  --ochre:#E2B160; --pot:#B06A47; --pot-rim:#8E5236; --bloom:#E07A57; --lavbloom:#B49BE0;
  --b1:#4B553A; --b2:#5A4A39; --b3:#4A4260; --b4:#3D4B57; --b5:#5E5132;
  --sky:#232A1D; --ground:#4D5735; --window:#E9DFC8; --shade:rgba(0,0,0,.2);
  --cat-dark:#2A221E; --cat-light:#EDE3D0; --cloud:#D9D3C6;
  --focus:#9CC3E6; --scene-dim:.3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body-font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 64px}

header.top{position:relative;padding:36px 0 10px;overflow:hidden}
.dapple{position:absolute;inset:-40px -200px auto auto;width:560px;height:260px;pointer-events:none}
h1{font-family:var(--display-font);font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:0;letter-spacing:-.01em;position:relative}
.sub{margin:10px 0 0;color:var(--ink-soft);position:relative;max-width:46ch}
.sub .pa{color:var(--a);font-weight:600}.sub .pb{color:var(--b);font-weight:600}
.toprow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;position:relative}
.status{font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--leaf);display:inline-block}
.status.local i{background:var(--ochre)}.status.ro i{background:var(--ink-soft)}

/* Big goal */
.goal{position:relative;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 24px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.goal svg.tree{width:104px;height:104px}
.goal h2{font-family:var(--display-font);font-weight:400;margin:0;font-size:1.45rem;line-height:1.2}
.goal .why{margin:4px 0 0;color:var(--ink-soft);font-style:italic}
.goal .line{margin:10px 0 0}
.goal .line strong{font-weight:600}
.vinewrap{position:relative;margin:30px 0 8px}
.vine{position:relative;height:14px;border-radius:999px;background:var(--paper-2);overflow:hidden;display:flex}
.vine i{display:block;height:100%}
.vine .va{background:var(--a)}.vine .vb{background:var(--b)}
.pace{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:2px}
.pace span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--ink-soft);white-space:nowrap;margin-bottom:2px}
.ms{position:absolute;top:-26px;width:22px;height:22px;transform:translateX(-50%)}
.gfacts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:12px;font-size:.92rem;color:var(--ink-soft)}
.gfacts b{display:block;font-family:var(--display-font);font-weight:400;font-size:1.3rem;color:var(--ink)}
.gfacts .pa b{color:var(--a)}.gfacts .pb b{color:var(--b)}
.counting{margin-top:10px;font-size:.85rem;color:var(--ink-soft)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line);padding-top:10px;margin:18px 0 24px}
.tab{appearance:none;background:none;border:0;padding:10px 16px 12px;cursor:pointer;color:var(--ink-soft);font-weight:500;border-radius:10px 10px 0 0;position:relative}
.tab[aria-selected="true"]{color:var(--ink);background:var(--card)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--moss);border-radius:2px}
.tabs .spacer{flex:1}
.ghost{appearance:none;background:none;border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink);font-size:.9rem}
.ghost:hover{background:var(--card)}
.ghost:disabled{opacity:.45;cursor:default}
.primary{appearance:none;border:0;border-radius:999px;padding:10px 20px;background:var(--moss);color:var(--card);cursor:pointer;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.45;cursor:default;filter:none}
.linkbtn{appearance:none;border:0;background:none;color:var(--moss);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.iconbtn{appearance:none;border:1px solid var(--line-strong);background:var(--card);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}

/* Forecast */
.forecast{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.fc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.fc .av{width:52px;height:52px;flex:none}
.fc .wx{width:46px;height:46px;flex:none;margin-left:auto}
.fc h3{margin:0;font-family:var(--display-font);font-weight:400;font-size:1.15rem;color:var(--pc)}
.fc p{margin:0;font-size:.85rem;color:var(--ink-soft)}

.daybar,.monthbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.daybar h2,.monthbar h2{font-family:var(--display-font);font-weight:400;font-size:1.6rem;margin:0;min-width:10ch}
.gardeners{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
.ghead .av{width:44px;height:44px;flex:none}
.ghead h3{font-family:var(--display-font);font-weight:400;font-size:1.4rem;margin:0;color:var(--pc);line-height:1.1}
.ghead small{display:block;color:var(--ink-soft);font-size:.85rem}
.ghead .acorns{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:600}
.ghead .acorns svg{width:20px;height:20px}
.scene{display:block;width:100%;height:auto;aspect-ratio:360/270}
.basketbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px 0}
.caption{margin:0;color:var(--ink-soft);font-size:.88rem;font-style:italic}
.rows{padding:6px 14px 6px}
.hrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;appearance:none;background:none;border:0;border-top:1px dashed var(--line);padding:8px 6px;border-radius:10px;min-height:52px}
.rows > :first-child{border-top:0}
button.hrow{cursor:pointer}
button.hrow:hover{background:var(--card-2)}
.hrow[disabled]{cursor:default}
.hrow .mini{width:34px;height:34px;flex:none}
.hrow .hn{flex:1;min-width:0}
.hrow .hs{display:block;font-size:.8rem;color:var(--ink-soft)}
.hrow:not(.mine) .hn{color:var(--ink-soft)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center}
.hrow.mine .check{border-color:var(--pc)}
.hrow.met .check{background:var(--pc);border-color:var(--pc)}
.hrow.mine .check::after{content:"";width:9px;height:5px;border:2px solid var(--pc);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.hrow.met .check::after{border-color:var(--card)}
.numin{display:flex;align-items:center;gap:6px;flex:none}
.numin input{width:70px;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:6px 8px;text-align:right}
.numin .u{font-size:.85rem;color:var(--ink-soft);min-width:2ch}
.note{padding:4px 18px 20px}
.note label{font-size:.85rem;color:var(--ink-soft);display:block;margin-bottom:4px}
.note textarea{width:100%;min-height:54px;resize:vertical;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.45}

.shared{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.shared h3{font-family:var(--display-font);font-weight:400;margin:0 0 10px;font-size:1.25rem}
.srow{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 1fr 1.2fr;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line);font-size:.92rem}
.srow:first-of-type{border-top:0}
.srow .pa{color:var(--a)}.srow .pb{color:var(--b)}
.srow .tg{color:var(--ink-soft)}
.srow small{display:block;color:var(--ink-soft);font-weight:400}

.welcome{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px;max-width:620px}
.welcome h2{font-family:var(--display-font);font-weight:400;margin:0 0 8px;font-size:1.7rem}
.welcome p{color:var(--ink-soft);margin:0 0 20px}
.empty{color:var(--ink-soft);font-style:italic;padding:8px 0}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:.8rem;color:var(--ink-soft);text-align:center;padding-bottom:4px}
.day{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:96px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.day:hover{border-color:var(--line-strong)}
.day.blank{visibility:hidden}
.day.future{opacity:.45;cursor:default}
.day.today{border:2px solid var(--moss)}
.day.sel{background:var(--card-2)}
.day .dn{font-weight:600;font-size:.95rem}
.day .wxs{position:absolute;top:6px;right:6px;display:flex;gap:2px}
.day .wxs svg{width:18px;height:18px}
.day .bars{display:flex;flex-direction:column;gap:4px;margin-top:auto}
.day .bar{height:7px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.day .bar i{display:block;height:100%;background:var(--c);border-radius:999px}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:.85rem;margin-top:12px}
.legend i{display:inline-block;width:18px;height:7px;border-radius:999px;margin-right:6px;vertical-align:middle}
.charts{margin-top:28px;display:grid;gap:18px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.chart h3{font-family:var(--display-font);font-weight:400;margin:0;font-size:1.2rem}
.chart p{margin:2px 0 8px;color:var(--ink-soft);font-size:.88rem}
.chart svg{width:100%;height:auto;display:block}

/* Garden */
.city{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow-x:auto}
.city svg{display:block}
.gardenintro{color:var(--ink-soft);margin:0 0 16px;max-width:62ch}
.summ{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:24px 0}
.summ div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.summ h3{font-family:var(--display-font);font-weight:400;margin:0 0 4px;color:var(--pc);font-size:1.25rem}
.summ p{margin:0;color:var(--ink-soft)}
.summ strong{color:var(--ink);font-weight:600}
.stats{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-size:.9rem}
.st th,.st td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.st th{color:var(--ink-soft);font-weight:500}
.st th:first-child,.st td:first-child{text-align:left;white-space:normal}
.st .pa{color:var(--a)}.st .pb{color:var(--b)}

/* Dialogs */
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--ink);width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(30,25,15,.45)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:22px}
.dlg h2{font-family:var(--display-font);font-weight:400;margin:0;font-size:1.5rem}
.dlg h3{font-size:1rem;margin:0 0 8px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field label,.flabel{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select,.field textarea,.hcard input,.hcard select{width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px}
.person{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card-2)}
.person .av{width:84px;height:84px}
.person .grid2{gap:8px}
.hcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--card-2)}
.hcard + .hcard{margin-top:10px}
.hcard .top{display:grid;grid-template-columns:1fr 36px;gap:8px}
.rm{appearance:none;background:none;border:0;cursor:pointer;color:var(--ink-soft);font-size:1.2rem;width:36px;height:36px;border-radius:50%}
.rm:hover{background:var(--paper)}
.dlgfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;bottom:0;background:var(--card);padding-top:10px}
.small{font-size:.85rem;color:var(--ink-soft);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px;font-size:.88rem;cursor:pointer;background:var(--paper)}
.chip input{margin:0;accent-color:var(--moss)}

.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.si{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--card-2);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.si svg{width:64px;height:64px}
.si strong{font-weight:600;font-size:.95rem}
.si .price{font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
.si .price svg{width:14px;height:14px}
.si button{width:100%}
.si.on{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.shophead{display:flex;align-items:center;gap:12px}
.shophead .av{width:56px;height:56px;flex:none}
.shophead .bal{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:600;font-size:1.1rem}
.shophead .bal svg{width:22px;height:22px}

/* Scene + weather animation */
.anim .spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
.anim .glow{animation:glow 5s ease-in-out infinite}
.anim .drift{animation:drift var(--dur,34s) linear infinite;animation-delay:var(--del,0s)}
.anim .drop{animation:drop var(--dur,.7s) linear infinite;animation-delay:var(--del,0s)}
.anim .flash{animation:flash 6s infinite;animation-delay:var(--del,0s)}
.anim .breathe{animation:breathe 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.anim .tail{animation:tail 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:90% 0%}
.anim .flutter{animation:flutter .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.anim .float{animation:float 7s ease-in-out infinite}
.anim .fall{animation:fall var(--dur,11s) linear infinite;animation-delay:var(--del,0s)}
.anim .flicker{animation:flicker 2.2s ease-in-out infinite}

.anim .bob{animation:bob 3s ease-in-out infinite}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{opacity:.5}}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(var(--dx,460px))}}
@keyframes drop{from{transform:translate(8px,-34px);opacity:0}15%{opacity:1}to{transform:translate(-8px,34px);opacity:.9}}
@keyframes flash{0%,86%,100%{opacity:0}87%{opacity:1}88.5%{opacity:.15}90%{opacity:.85}92%{opacity:0}}
@keyframes breathe{50%{transform:scale(1.035,1.06)}}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes flutter{to{transform:scaleX(.35)}}
@keyframes float{0%,100%{transform:translate(0,0)}25%{transform:translate(22px,-10px)}50%{transform:translate(40px,6px)}75%{transform:translate(14px,14px)}}
@keyframes fall{from{transform:translate(0,-40px) rotate(0)}to{transform:translate(-50px,320px) rotate(300deg)}}
@keyframes flicker{50%{opacity:.55}}

@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  .anim *, .pop{animation:none !important}
}

@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr}
  .wrap{padding:0 14px 48px}
  .day{min-height:70px;padding:5px;border-radius:10px}
  .day .dn{font-size:.82rem}
  .day .wxs svg{width:13px;height:13px}
  .cal{gap:4px}
  .srow{grid-template-columns:1fr 1fr;row-gap:4px}
  .srow > :first-child,.srow > .tg{grid-column:1 / -1}
  .goal{grid-template-columns:1fr;padding:18px}
  .goal svg.tree{display:none}
  .forecast{grid-template-columns:1fr}
  .person{grid-template-columns:1fr}
}
[hidden]{display:none !important}

.banner{margin-top:20px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.banner svg{display:block;width:100%;height:auto}
.banner .cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 16px;font-size:.85rem;color:var(--ink-soft)}

/* Accountability */
.acct{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 20px;margin-bottom:24px}
.accthead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.accthead h2{font-family:var(--display-font);font-weight:400;margin:0;font-size:1.45rem}
.youare{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{appearance:none;border:0;background:none;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink-soft);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--pc,var(--moss));color:var(--card)}
.buddies{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.buddy{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--card-2);display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.buddy .av{width:52px;height:52px;grid-row:span 2}
.buddy .wx{width:46px;height:46px;grid-row:span 2}
.buddy h3{margin:0;font-family:var(--display-font);font-weight:400;font-size:1.2rem;color:var(--pc);line-height:1.2}
.buddy h3 em{font-family:var(--body-font);font-style:normal;font-size:.75rem;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:middle}
.buddy .meta{font-size:.85rem;color:var(--ink-soft);margin:0}
.buddy .meta strong{color:var(--ink);font-weight:600}
.buddy .yest{grid-column:1 / -1;margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:.86rem;color:var(--ink-soft)}
.buddy .yest ul{margin:4px 0 0;padding-left:18px}
.buddy .yest q{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--leaf)}.dot.off{background:var(--ochre)}
.thread{margin-top:16px;display:grid;grid-template-columns:1fr;gap:8px;max-height:280px;overflow-y:auto;padding-right:4px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:80%}
.msg .av{width:30px;height:30px;flex:none}
.msg .bub{background:var(--card-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:.92rem}
.msg .bub small{display:block;color:var(--ink-soft);font-size:.75rem;margin-top:2px}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bub{border-radius:16px 16px 4px 16px;background:color-mix(in srgb, var(--pc) 14%, var(--card))}
.msg .kind{font-weight:600;color:var(--pc)}
.composer{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.composer input{flex:1 1 220px;min-width:0;background:var(--paper);border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.pickme{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:.92rem;color:var(--ink-soft)}

.spot{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft)}
.spot select{background:var(--paper);border:1px solid var(--line-strong);border-radius:999px;padding:5px 10px;font-size:.85rem}
.basketbar{flex-wrap:wrap}
.cardtools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 18px 0}
.whyin{margin-top:6px;width:100%;background:var(--paper);border:1px dashed var(--line-strong);border-radius:10px;padding:5px 10px;font-size:.85rem}
.hwrap{border-top:1px dashed var(--line);padding:2px 0 8px}
.rows > .hwrap:first-child{border-top:0}
.hwrap .hrow{border-top:0}
.hwrap .whyin{margin-left:50px;width:calc(100% - 56px)}
.durin{display:flex;align-items:center;gap:4px;flex:none}
.durin input{width:48px;background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:6px 6px;text-align:right}
.durin span,.clockin span{font-size:.82rem;color:var(--ink-soft)}
.clockin input{background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:5px 8px}
.pair{display:flex;gap:6px;align-items:center}
.pair input{width:70px !important}

.anim .rainf{animation:rainf var(--dur,.8s) linear infinite;animation-delay:var(--del,0s)}
.anim .snowf{animation:snowf var(--dur,9s) linear infinite;animation-delay:var(--del,0s)}
.anim .blow{animation:blow var(--dur,7s) linear infinite;animation-delay:var(--del,0s)}
.anim .fogd{animation:fogd var(--dur,40s) ease-in-out infinite alternate;animation-delay:var(--del,0s)}
.anim .swing{animation:swing 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
.anim .shimmer{animation:shimmer 3s ease-in-out infinite;animation-delay:var(--del,0s)}
.anim .windl{animation:windl var(--dur,2.4s) linear infinite;animation-delay:var(--del,0s)}
.anim .ripple{animation:ripple 1.6s ease-out infinite;animation-delay:var(--del,0s);transform-box:fill-box;transform-origin:center}
@keyframes rainf{from{transform:translate(0,0)}to{transform:translate(-26px,330px)}}
@keyframes snowf{0%{transform:translate(0,0)}25%{transform:translate(10px,80px)}50%{transform:translate(-6px,160px)}75%{transform:translate(8px,240px)}100%{transform:translate(-4px,330px)}}
@keyframes blow{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(calc(var(--dx,420px) / 2),30px) rotate(200deg)}100%{transform:translate(var(--dx,420px),-10px) rotate(400deg)}}
@keyframes fogd{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes shimmer{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:.7;transform:translateX(6px)}}
@keyframes windl{from{transform:translateX(-80px);opacity:0}20%{opacity:.8}to{transform:translateX(var(--dx,420px));opacity:0}}
@keyframes ripple{from{transform:scale(.3);opacity:.8}to{transform:scale(1.4);opacity:0}}
@media (max-width:640px){ .buddies{grid-template-columns:1fr} .msg{max-width:95%} }
/* v5: motion + new animation classes */
.anim .sway{animation:sway var(--swd,6s) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(calc(var(--swa,1.5) * -1deg))}50%{transform:rotate(calc(var(--swa,1.5) * 1deg))}}
.anim .pulse{animation:pulse 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.1}}
.anim .fly{animation:fly var(--dur,18s) linear infinite;animation-delay:var(--del,0s)}
@keyframes fly{0%{transform:translate(0,0)}50%{transform:translate(calc(var(--dx,420px) / 2),-10px)}100%{transform:translate(var(--dx,420px),4px)}}
.anim .flap{animation:flap .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:scaleY(-.6)}}
.anim .tumble{animation:tumble 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tumble{to{transform:rotate(360deg) scaleX(.5)}}
.anim .rainbow{animation:rainbow 14s ease-in-out infinite;opacity:0}
@keyframes rainbow{0%,15%{opacity:0}35%,70%{opacity:.5}90%,100%{opacity:0}}
.anim .splash{animation:splash .9s ease-out infinite;animation-delay:var(--del,0s);transform-box:fill-box;transform-origin:50% 100%}
@keyframes splash{0%{transform:scale(.2);opacity:0}30%{opacity:.9}100%{transform:scale(1.2) translateY(-2px);opacity:0}}
.anim .accum{animation:accum 20s ease-out forwards;opacity:.15}
@keyframes accum{to{opacity:.4}}
.anim .pan{animation:pan 160s ease-in-out infinite alternate}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(var(--pan,-1000px))}}
.anim .breathe-soft{animation:breathe2 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe2{50%{transform:scale(1.01,1.025)}}
.anim .blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.anim .wave{animation:wave 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
.anim .pageflip{animation:pageflip 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pageflip{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-4deg) translateY(-1px)}}
.anim .headtilt{animation:headtilt 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes headtilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(2deg)}}
body.calm .anim *{animation-duration:calc(var(--dur, 6s) * 1.6)}
body.still .anim *, body.still .pop, body.still .wiz *{animation:none !important}

/* Lighter main page */
.goal.compact{grid-template-columns:auto 1fr;padding:16px 20px;gap:16px;align-items:center}
.goal.compact svg.tree{width:70px;height:70px}
.goal.compact h2{font-size:1.25rem}
.goal .chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.goal .chips2 span{font-size:.82rem;color:var(--ink-soft);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.goal .chips2 b{color:var(--ink);font-weight:600}
.goal .chips2 .pa b{color:var(--a)}.goal .chips2 .pb b{color:var(--b)}
.vinewrap{margin:26px 0 4px}
details.more{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 18px}
details.more > summary{cursor:pointer;font-weight:600;color:var(--ink-soft)}
details.more[open] > summary{margin-bottom:12px}
.buddy{grid-template-columns:auto 1fr auto}
.buddy .late{color:var(--a);font-weight:600}
.notebtn{font-size:.85rem}
.gcard .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 18px 16px;flex-wrap:wrap}
.gcard .placetag{font-size:.82rem;color:var(--ink-soft)}
.gcard .note{padding:0 18px 16px}
.yline{grid-column:1 / -1;font-size:.86rem;color:var(--ink-soft);margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--line)}
.yline summary{cursor:pointer}

/* Setup wizard */
#wizard{width:min(860px,calc(100vw - 16px));max-height:calc(100dvh - 24px);overflow:hidden;padding:0}
#wizard[open]{display:flex;flex-direction:column}
.wtop{padding:16px 22px 0}
.wprog{height:6px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.wprog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--leaf) 0 10px,var(--leaf-2) 10px 20px);border-radius:999px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.wnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wnav button{appearance:none;border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;color:var(--ink-soft)}
.wnav button[aria-current="step"]{background:var(--moss);color:var(--card);border-color:var(--moss)}
.wbody{flex:1;overflow-y:auto;padding:18px 22px}
.wstep{animation:wslide .45s cubic-bezier(.2,1,.4,1)}
.wstep.back{animation-name:wslideb}
@keyframes wslide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes wslideb{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.wstep h2{font-family:var(--display-font);font-weight:400;font-size:clamp(1.5rem,4vw,2rem);margin:0 0 6px;line-height:1.15}
.wstep .lede{color:var(--ink-soft);margin:0 0 18px;max-width:52ch}
.wfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px 16px;border-top:1px solid var(--line);background:var(--card)}
.wfoot .right{display:flex;gap:8px}
.bigin{width:100%;font-size:1.15rem;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:14px;padding:12px 14px}
.bigin:focus{border-color:var(--moss);outline:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--moss) 25%, transparent)}
.namecards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.namecard{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--card-2);display:grid;gap:10px;justify-items:start}
.namecard .av{width:72px;height:72px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill2{appearance:none;border:1.5px solid var(--line-strong);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.92rem;transition:transform .15s}
.pill2[aria-pressed="true"]{background:var(--pc,var(--moss));border-color:var(--pc,var(--moss));color:var(--card);animation:tilepop .3s}
.pill2:active{transform:scale(.95)}
.builder{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:20px;align-items:start}
.preview{position:sticky;top:0;background:var(--card-2);border:1px solid var(--line);border-radius:22px;padding:10px;text-align:center}
.preview svg.scene{border-radius:16px}
.preview .dice{margin-top:10px}
.cattabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.cattabs button{appearance:none;border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink-soft);font-weight:500;border-radius:10px 10px 0 0}
.cattabs button[aria-selected="true"]{color:var(--ink);background:var(--card-2);box-shadow:inset 0 -2px 0 var(--pc,var(--moss))}
.optgroup{margin-bottom:16px}
.optgroup h4{margin:0 0 8px;font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.tile{appearance:none;border:1.5px solid var(--line);background:var(--card-2);border-radius:14px;padding:6px 4px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--ink-soft);transition:transform .15s, border-color .15s}
.tile svg{width:48px;height:48px}
.tile:hover{transform:translateY(-2px)}
.tile[aria-pressed="true"]{border-color:var(--pc,var(--moss));background:color-mix(in srgb, var(--pc,var(--moss)) 12%, var(--card));color:var(--ink);animation:tilepop .3s}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{appearance:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line-strong);cursor:pointer;transition:transform .15s}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--pc,var(--moss));transform:scale(1.1)}
@keyframes tilepop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{appearance:none;border:1.5px solid var(--line);background:var(--card-2);border-radius:18px;padding:12px;cursor:pointer;text-align:left;display:grid;grid-template-columns:40px 1fr;gap:4px 10px;align-items:center;position:relative;transition:transform .15s}
.scard:hover{transform:translateY(-2px)}
.scard svg{width:40px;height:40px;grid-row:span 2}
.scard strong{font-size:.92rem;line-height:1.2}
.scard small{color:var(--ink-soft);font-size:.75rem}
.scard[aria-pressed="true"]{border-color:var(--moss);background:color-mix(in srgb, var(--moss) 12%, var(--card));animation:tilepop .3s}
.scard[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--moss);color:var(--card);font-size:.75rem;display:grid;place-items:center}
.addown{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.addown input{flex:1 1 200px;background:var(--paper);border:1px solid var(--line-strong);border-radius:999px;padding:9px 14px}
.tune{display:grid;gap:10px}
.tunecard{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card-2);display:grid;grid-template-columns:44px 1fr;gap:6px 12px;align-items:start}
.tunecard .ico{appearance:none;border:0;background:none;cursor:pointer;padding:0;width:44px;height:44px}
.tunecard .ico svg{width:44px;height:44px}
.tunecard input.nm{font-weight:600;background:none;border:0;border-bottom:1px dashed var(--line-strong);padding:2px 0;width:100%;font-size:1rem}
.tunecard .rowx{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--ink-soft)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--paper)}
.stepper button{appearance:none;border:0;background:none;width:32px;height:32px;cursor:pointer;font-size:1.1rem}
.stepper span{min-width:70px;text-align:center;font-weight:600;color:var(--ink)}
.rangewrap{display:grid;gap:6px;margin-top:14px}
.rangewrap input[type=range]{width:100%;accent-color:var(--moss)}
.citygrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.citycol h3{font-family:var(--display-font);font-weight:400;margin:0 0 8px;color:var(--pc)}
.citycol .scene{border-radius:16px;border:1px solid var(--line)}
.prefs{display:grid;gap:12px}
.prefrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card-2)}
.prefrow b{display:block;font-weight:600}
.prefrow small{color:var(--ink-soft)}
.prefrow input[type=time]{background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;padding:6px 8px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.hero svg.scene{border-radius:18px}
.confetti{position:relative;height:0}
.confetti i{position:absolute;top:-20px;width:10px;height:5px;border-radius:5px;animation:conf 2.6s ease-in forwards}
@keyframes conf{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(340px) rotate(540deg);opacity:0}}
@media (max-width:700px){
  .builder,.namecards,.citygrid,.hero{grid-template-columns:1fr}
  .preview{position:static}
  .wbody{padding:14px}
}

.figbig{display:block;width:100%;max-height:240px;margin-bottom:8px}
.coinbtn{appearance:none;border:1px solid var(--line-strong);background:var(--card-2);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;color:var(--ink)}
.coinbtn:hover{background:var(--paper)}
.si small.from{color:var(--ink-soft);font-size:.75rem;margin-top:-4px}
.si svg{width:84px;height:84px}
#shop{width:min(820px,calc(100vw - 16px))}
#shop .shopgrid{max-height:min(58vh,560px);overflow-y:auto;padding:2px}
.anim .twinkle{animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.anim .flutter-slow{animation:fanflutter 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fanflutter{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.anim .steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(2px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-4px)}}
.wq{display:grid;gap:18px}
.wq h3{margin:0 0 8px;font-size:1rem;font-weight:600}
.skiplink{margin-left:auto}
.minilook{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:20px;align-items:start}
@media (max-width:700px){.minilook{grid-template-columns:1fr}.minilook .figbig{max-height:180px}}
.stage{position:relative}
.stagecap{margin:0;padding:8px 18px 0;font-size:.88rem;color:var(--ink-soft);font-style:italic}
.focusbar{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:thin}
.fchip{appearance:none;flex:none;border:1.5px solid var(--line);background:var(--card-2);border-radius:14px;padding:4px 10px 4px 6px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.8rem;color:var(--ink-soft)}
.fchip svg{width:26px;height:26px}
.fchip.ok{border-color:color-mix(in srgb, var(--pc) 50%, var(--line))}
.fchip.ok::after{content:"✓";color:var(--pc);font-weight:700}
.fchip[aria-selected="true"]{background:color-mix(in srgb, var(--pc) 14%, var(--card));border-color:var(--pc);color:var(--ink)}
.gardeners{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.anim .swingarm{animation:swingarm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
@keyframes swingarm{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.anim .jogbob{animation:jogbob .5s ease-in-out infinite alternate}
@keyframes jogbob{to{transform:translateY(-4px)}}
.anim .kite{animation:kite 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes kite{0%,100%{transform:rotate(-8deg) translate(0,0)}50%{transform:rotate(10deg) translate(4px,-4px)}}
.anim .bubbleA{animation:bubA 6s ease-in-out infinite}
.anim .bubbleB{animation:bubB 6s ease-in-out infinite}
@keyframes bubA{0%,5%{opacity:0;transform:translateY(4px)}12%,45%{opacity:1;transform:none}55%,100%{opacity:0}}
@keyframes bubB{0%,48%{opacity:0;transform:translateY(4px)}58%,92%{opacity:1;transform:none}100%{opacity:0}}

<script>
(() => {

/* ---------- constants ---------- */

  borghese:{name:"Villa Borghese", city:"Rome"}, ueno:{name:"Ueno Park", city:"Tokyo"},
  central:{name:"Central Park", city:"New York"}, crissy:{name:"Crissy Field", city:"San Francisco"}, philopappou:{name:"Philopappou Hill", city:"Athens"},

const guessItem = n => {

const CATS = {

  journal:{label:"Journaling", icon:"journal"}, study:{label:"Study and focus", icon:"laptop"}, language:{label:"Languages", icon:"speech"},
  nourish:{label:"Food and drink", icon:"bread"}, unplug:{label:"Less screen time", icon:"phone"}, connect:{label:"Connection", icon:"heart"}

const guessCat = n => {
  n = (n||"").toLowerCase();
  if (/screen|phone|social|scroll|unplug|offline/.test(n)) return "unplug";
  if (/language|spanish|french|italian|japanese|chinese|mandarin|german|danish|hindi|greek|vocab|duolingo/.test(n)) return "language";
  if (/read|book|page/.test(n)) return "read";
  if (/water|drink|cook|eat|meal|fruit|veg|breakfast|food/.test(n)) return "nourish";
  if (/walk|run|move|step|gym|exercise|workout|yoga|swim|bike|cycl/.test(n)) return "move";
  if (/journal|write|gratitude|diary/.test(n)) return "journal";
  if (/meditat|breath|mindful|pray/.test(n)) return "mindful";
  if (/study|work|focus|code|practi|piano|guitar|homework|learn/.test(n)) return "study";
  if (/sleep|bed|lights|wake|nap/.test(n)) return "sleep";
  if (/call|family|friend|text|mum|mom|dad|connect|letter/.test(n)) return "connect";
  return "study";
};
const ITEM_CAT = {book:"read", sneakers:"move", pillow:"sleep", flowers:"mindful", journal:"journal", headphones:"study", phone:"unplug", bottle:"nourish", bread:"nourish", fruit:"nourish", mug:"sleep", plant:"mindful"};
const SUGGESTIONS = [
  {name:"Screen time", type:"duration", dir:"max", target:180, cat:"unplug"},
  {name:"Read 20 pages", type:"check", cat:"read"},
  {name:"Exercise", type:"duration", dir:"min", target:30, cat:"move"},
  {name:"Lights out", type:"clock", dir:"max", target:1410, cat:"sleep"},
  {name:"Wake up", type:"clock", dir:"max", target:450, cat:"sleep"},
  {name:"Drink 8 glasses of water", type:"check", cat:"nourish"},
  {name:"Meditate", type:"duration", dir:"min", target:10, cat:"mindful"},
  {name:"Journal", type:"check", cat:"journal"},
  {name:"Deep work", type:"duration", dir:"min", target:120, cat:"study"},
  {name:"Practise a language", type:"duration", dir:"min", target:20, cat:"language"},
  {name:"Cook at home", type:"check", cat:"nourish"},
  {name:"Call family", type:"check", cat:"connect"},
  {name:"No social media before noon", type:"check", cat:"unplug"},
  {name:"Walk outside", type:"duration", dir:"min", target:30, cat:"move"}
];
const QUICK = {
  cheer:{label:"Cheer", text: n => `Proud of you, ${n}. Keep going!`},
  nudge:{label:"Nudge", text: n => `Gentle nudge, ${n}: I haven’t seen your check-in yet today.`},
  ask:{label:"Ask", text: n => `How’s today going, ${n}?`}
};
/* ---------- dates & formats ---------- */
const pad = n => String(n).padStart(2,"0");
const fmt = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); };
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const today = () => fmt(new Date());
const shortDate = s => parse(s).toLocaleDateString(undefined,{month:"short", day:"numeric"});
const prettyDay = s => { const t = today(); if (s===t) return "Today"; if (s===addDays(t,-1)) return "Yesterday"; return parse(s).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}); };
const fmtNum = v => (Math.round(v*100)/100).toString();
const fmtDur = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h && r ? `${h} h ${r} min` : h ? `${h} h` : `${r} min`; };
const fmtClock = m => { m = ((Math.round(m)%1440)+1440)%1440; const d = new Date(2000,0,1,Math.floor(m/60),m%60); return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",hour12:!pref("clock24")}); };
const clockStr = m => m==null||m==="" ? "" : `${pad(Math.floor((m%1440)/60))}:${pad(m%60)}`;
const parseClock = s => { const x = /^(\d{1,2}):(\d{2})/.exec(s||""); return x ? (+x[1])*60 + (+x[2]) : null; };
const timeAt = iso => { try { return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",hour12:!pref("clock24")}); } catch { return ""; } };
const hashF = str => { let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return ((h>>>0)%10000)/10000; };
const rnd = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- state ---------- */
const S = { config:null, logs:{}, picnic:{a:{},b:{}}, messages:[], loaded:false, mode:"loading", readOnly:false,
  tab:"day", day:today(), month:today().slice(0,7), windowStart:addDays(today(),-365), pop:new Set(), me:null };
try { const m = localStorage.getItem(MEKEY); if (m==="a"||m==="b") S.me = m; } catch {}
S.motion = "lively"; try { const mo = localStorage.getItem("botanology-city-motion"); if (["lively","calm","still"].includes(mo)) S.motion = mo; } catch {}
const PREF_DEFAULTS = {checkinBy:1260, weekStart:"mon", clock24:false, weatherMode:"progress", askWhy:true};
const pref = k => (S.config?.prefs && k in S.config.prefs) ? S.config.prefs[k] : PREF_DEFAULTS[k];
const dirty = {}, writing = {}, timers = {};
let store = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const name = p => (S.config?.people?.[p]?.name || "").trim() || (p==="a" ? "Gardener A" : "Gardener B");
const other = p => p==="a" ? "b" : "a";
function migrateAv(av, p){
  const o = {...DEFAULT_AV[p], ...(av||{})};
  if (av && av.acc && !av.head && !av.glasses) { if (av.acc==="glasses") o.glasses = "round"; else if (["beret","headphones","flower"].includes(av.acc)) { o.head = av.acc; o.glasses = "none"; } else { o.head = "none"; o.glasses = "none"; } }
  delete o.acc; return o;
}
const avatarOf = p => ({...migrateAv(S.config?.people?.[p]?.avatar, p), _look: lookOf(p)});
const pronOf = p => PRONOUNS[S.config?.people?.[p]?.pron] || PRONOUNS.they;
const placeOf = p => { const pl = S.picnic[p]?.place === "alamo" ? "crissy" : S.picnic[p]?.place; return PLACES[pl] ? pl : DEFAULT_PLACE[p]; };
const CITY_TZ = {beijing:"Asia/Shanghai", paris:"Europe/Paris", rome:"Europe/Rome", tokyo:"Asia/Tokyo", nyc:"America/New_York", sf:"America/Los_Angeles", athens:"Europe/Athens", london:"Europe/London", copenhagen:"Europe/Copenhagen", delhi:"Asia/Kolkata"};
function cityNow(city){
  try { const parts = new Intl.DateTimeFormat("en-US",{timeZone:CITY_TZ[city]||"UTC", hour:"numeric", minute:"numeric", month:"numeric", hour12:false}).formatToParts(new Date());
    const g = t => +parts.find(x=>x.type===t).value; return {h:g("hour")%24, m:g("minute"), mo:g("month")}; } catch { const d = new Date(); return {h:d.getHours(), m:d.getMinutes(), mo:d.getMonth()+1}; }
}
const PHASE_LABEL = {dawn:"dawn", day:"daytime", golden:"golden hour", dusk:"dusk", night:"night"};
function phaseFor(city){
  const {h, m, mo} = cityNow(city), t = h + m/60;
  const [rise, set] = mo>=5&&mo<=8 ? [5.5,20] : mo>=11||mo<=2 ? [7.5,16.8] : [6.5,18.6];
  if (t < rise-1 || t >= set+1.5) return "night";
  if (t < rise+.6) return "dawn";
  if (t >= set+.4) return "dusk";
  if (t >= set-1) return "golden";
  return "day";
}
function cityClock(city){ try { return new Date().toLocaleTimeString(undefined,{timeZone:CITY_TZ[city], hour:"numeric", minute:"2-digit", hour12:!pref("clock24")}); } catch { return ""; } }
const phaseOfP = (p, d) => d === today() ? phaseFor(cityOf(placeOf(p))) : "day";
const PETS = {cat:"Cat", dog:"Dog", bunny:"Bunny", fox:"Fox", duck:"Duck", hedgehog:"Hedgehog", tortoise:"Tortoise", panda:"Red panda"};
const petOf = p => PETS[S.config?.people?.[p]?.pet] ? S.config.people[p].pet : "cat";
const habits = () => (S.config?.habits || []).map((h,i) => {
  const type = ["check","duration","clock","number"].includes(h.type) ? h.type : "check";
  let share = h.who==="both" ? (h.share || "each") : "each";
  if (share==="combined" && !(type==="duration"||type==="number")) share = "each";
  const cat = CATS[h.cat] ? h.cat : (h.item && ITEM_CAT[h.item] && !/language|call|family/i.test(h.name) ? ITEM_CAT[h.item] : guessCat(h.name));
  return {...h, type, share, cat, item: CATS[cat].icon, plant: h.plant || PLANT_KINDS[i%6], target:Number(h.target)||0};
});
const applies = (h,p) => h.who==="both" || h.who===p;
const key = (d,p) => d+"_"+p;
const val = (d,p,hid) => { const v = S.logs[key(d,p)]?.values?.[hid]; return typeof v==="number" ? v : null; };
const done = (d,p,hid) => !!S.logs[key(d,p)]?.done?.[hid];
const adj = (v,h) => (h.type==="clock" && h.target >= 1080 && v < 360) ? v + 1440 : v;
const cmp = (v,h) => h.dir==="max" ? adj(v,h) <= h.target : adj(v,h) >= h.target;
function indiv(d,p,h){ if (h.type==="check") return done(d,p,h.id); const v = val(d,p,h.id); return v!==null && cmp(v,h); }
function mine(d,p,h){
  if (h.share==="combined") return val(d,p,h.id)!==null;
  return indiv(d,p,h);

/* ---------- storage ---------- */
function localStore(){

    start(){ const o = read(); S.config = o.config||null; S.logs = o.logs||{}; S.picnic = o.picnic||{a:{},b:{}}; S.messages = o.messages||[]; S.loaded = true; widenForGoal(); render(); },
    async setConfig(c){ const o = read(); o.config = c; write(o); },

    async setPicnic(p,v){ const o = read(); o.picnic = o.picnic||{}; o.picnic[p] = v; write(o); },

function dbStore(db){
  let unsub = null;

    if (unsub) unsub();
    unsub = db.collection("logs").where("date", ">=", S.windowStart).onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
      for (const k in dirty) if (S.logs[k]) next[k] = S.logs[k];
      S.logs = next; S.loaded = true; render();
    }, onDbError);
  }
  return { mode:"db",
    start(){
      db.doc("config/main").onSnapshot(s => { S.config = s.exists ? s.data() : null; widenForGoal(); render(); }, onDbError);
      P.forEach(p => db.doc("picnic/"+p).onSnapshot(s => { if (!dirty["picnic-"+p]) { S.picnic[p] = s.exists ? s.data() : {}; render(); } }, onDbError));
      db.collection("messages").orderBy("ts","desc").limit(40).onSnapshot(snap => {
        const pending = S.messages.filter(m => m._pending && !snap.docs.some(d => d.id===m.id));
        S.messages = [...pending, ...snap.docs.filter(d=>d.exists).map(d => ({id:d.id, ...d.data()}))]; render();
      }, onDbError);
      subLogs();
    },
    async setConfig(c){ await db.doc("config/main").set(c); },
    async setLog(k,v){ await db.collection("logs").doc(k).set(v); },
    async setPicnic(p,v){ await db.doc("picnic/"+p).set(v); },
    async addMessage(id,m){ await db.collection("messages").doc(id).set(m); },
    resub: subLogs };
}
function widen(date){ if (date && date < S.windowStart) { S.windowStart = addDays(date,-7); store?.resub(); } }

function chainWrite(k, fn){

function snapshotMet(d){ const o = {}; for (const p of P) for (const h of habits()) o[p+h.id] = met(d,p,h); return o; }

}

/*SCENE*/
const PHASE_SKY = {dawn:["#B9A6C9","#F6C9A8"], golden:["#E7B07A","#F6D9A0"], dusk:["#4A4A7A","#E59A7A"], night:["#141B36","#2B3762"]};
const PHASE_TINT = {dawn:["#F2A88A",.14], golden:["#F2A65A",.16], dusk:["#3A2E5E",.32], night:["#0E1430",.48]};
function skyFor(w, phase){
  if (phase==="night") return ["drizzle","rain","storm","overcast","fog","snow","blizzard"].includes(w) ? ["#1A2030","#323A4A"] : PHASE_SKY.night;
  if (phase==="dusk") return ["rain","storm","overcast"].includes(w) ? ["#3A3A52","#7A6A7A"] : PHASE_SKY.dusk;
  if (phase==="dawn"||phase==="golden") return ["rain","storm","overcast","fog","drizzle"].includes(w) ? ["#9A9AA4","#D8C2A8"] : PHASE_SKY[phase];
  return SKY[w];
}
function nightLights(R, W, phase){
  if (phase!=="night" && phase!=="dusk") return "";
  let s = "";
  for (let i=0;i<Math.round(16*W/360);i++) s += `<rect x="${(R()*W).toFixed(0)}" y="${(40+R()*68).toFixed(0)}" width="3" height="4" fill="#F6D27A" opacity="${(.5+R()*.5).toFixed(2)}" class="${R()>.7?"glow":""}"/>`;
  if (phase==="night") for (let i=0;i<Math.round(10*W/360);i++) s += `<path class="twinkle" style="animation-delay:-${(R()*2).toFixed(1)}s" d="M${(R()*W).toFixed(0)} ${(6+R()*40).toFixed(0)} h.1" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>`;
  return s;
}
function bannerSVG(){
  const t = today(), ra = weekRate("a",t), rb = weekRate("b",t);
  const r = ra===null && rb===null ? null : ((ra??rb) + (rb??ra))/2;
  const w = wxFor(r, t, "shared"), season = seasonFor(t), R = rnd(7);
  const order = Object.keys(PLACES), total = order.length*360;
  const [swd, swa] = SWAY[w] || SWAY.none;
  let defs = "", body = "";
  order.forEach((pl,i) => {
    const city = cityOf(pl), ph = phaseFor(city), sky = skyFor(w, ph), tint = PHASE_TINT[ph];
    defs += `<linearGradient id="bsky${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>`;
    body += `<g transform="translate(${i*360} 0)"><rect width="360" height="160" fill="url(#bsky${i})"/>${groundSVG(pl, season, 360, 124, 36, rnd(i+40))}${BACKDROP[pl](season, isSnowy(w), rnd(pl.length*7+3))}${passersby(pl, rnd(i+90), isWet(w), 360)}${tint?`<rect width="360" height="160" fill="${tint[0]}" opacity="${tint[1]}"/>`:""}${nightLights(rnd(i+9), 360, ph)}<text x="180" y="152" text-anchor="middle" font-size="11" font-family="Instrument Sans, sans-serif" fill="${ph==="night"||ph==="dusk"?"#F4EEE2":"#3B2E22"}" opacity=".85">${esc(PLACES[pl].city)}, <tspan class="cityclock" data-city="${city}"></tspan></text></g>`;
  });

/* ---------- living crowds ---------- */
function rotating(list, dur, begin){
  const n = list.length;
  if (motionOff() || n < 2) return list[0] || "";
  return list.map((g,i) => {
    const st = i/n, en = (i+1)/n, f = .035;
    let kt, vals;
    if (i===0) { kt = [0, f, en-f, en, 1]; vals = [0,1,1,0,0]; }
    else if (i===n-1) { kt = [0, st, st+f, 1-f, 1]; vals = [0,0,1,1,0]; }
    else { kt = [0, st, st+f, en-f, en, 1]; vals = [0,0,1,1,0,0]; }
    return `<g opacity="${i===0?1:0}"><animate attributeName="opacity" values="${vals.join(";")}" keyTimes="${kt.map(v=>v.toFixed(3)).join(";")}" dur="${dur}s" begin="-${begin||0}s" repeatCount="indefinite"/>${g}</g>`;
  }).join("");
}

    <div class="rangewrap"><h4 style="margin:0;font-size:.85rem;color:var(--ink-soft)">How ambitious?</h4><input type="range" min="50" max="100" step="5" data-wf="amb" value="${g.ambition}" aria-label="Ambition"><span class="small" id="ambtxt">${g.ambition}% of everything possible, which is <b>${goalCount()}</b> daily goals met together by ${esc(shortDate(g.end))}.</span></div>`;
}
function wPlaceOne(p){
  const sp = D().places[p], c = cityOf(sp);
  return `<h2>Which city is ${esc(nm(p))} in?</h2><p class="lede">Pick a city${CITIES[c].spots.length>1?", then a spot":""}.</p>
    <div style="--pc:var(--${p})">${pills(`data-w="city" data-p="${p}"`, Object.entries(CITIES).map(([k,v])=>[k,v.name]), c, `style="--pc:var(--${p})"`)}
    ${CITIES[c].spots.length>1 ? `<div style="margin-top:8px">${pills(`data-w="spot" data-p="${p}"`, CITIES[c].spots.map(s=>[s,PLACES[s].name]), sp, `style="--pc:var(--${p})"`)}</div>` : ""}
    <div style="margin-top:12px;max-width:520px">${sceneSVG(p, today(), {empty:true, av:D().people[p].avatar, pet:D().people[p].pet, place:sp, w:"breezy", frac:.5, act:"language", uid:"po"+p, season:D().season==="auto"?seasonFor(today()):D().season, label:`${PLACES[sp].name}, ${PLACES[sp].city}`})}</div></div>`;
}
function wCheckin(){
  const pr = D().prefs;
  return `<h2>Two last things</h2><div class="wq">
    <div><h3>When should you both have checked in by each day?</h3><input class="bigin" style="max-width:220px" type="time" data-wf="checkinBy" value="${clockStr(pr.checkinBy)}" aria-label="Check in by"></div>
    <div><h3>Which season should the cities show?</h3>${pills('data-w="season"', [["auto","Follow the calendar"],["spring","Spring"],["summer","Summer"],["fall","Fall"],["winter","Winter"]], D().season)}</div></div>`;
}
function buildConfig(){
  const d = D(), g = d.goal;
  const habitsOut = d.habits.filter(h => String(h.name).trim()).map((h,i) => {
    const cat = CATS[h.cat] ? h.cat : guessCat(h.name);
    const o = {id:h.id, name:String(h.name).trim(), type:h.type, cat, item:CATS[cat].icon, plant:h.plant||PLANT_KINDS[i%6], who:h.who||"both"};
    if (h.style) o.style = h.style;
    if (o.who==="both") o.share = h.share==="both" ? "both" : (h.share==="combined" && (h.type==="duration"||h.type==="number")) ? "combined" : "each";
    if (h.type!=="check") { o.dir = h.dir==="min"?"min":"max"; o.target = Number(h.target)||0; if (h.unit) o.unit = h.unit; if (h.baseline && Object.keys(h.baseline).length) o.baseline = h.baseline; }
    return o;
  });
  const keep = new Set(habitsOut.map(h=>h.id));
  return {
    people: Object.fromEntries(P.map(p => [p, {name:(d.people[p].name||"").trim(), pron:d.people[p].pron, pet:d.people[p].pet||"cat", avatar:d.people[p].avatar}])),
    season: d.season, prefs: d.prefs,
    goal: g.text.trim() ? {text:g.text.trim(), why:(g.why||"").trim(), start:g.start, end:g.end, len:g.len, ambition:g.ambition, count:goalCount(), habitIds:(g.habitIds||[]).filter(id=>keep.has(id))} : null,
    habits: habitsOut
  };
}
async function saveWizard(){
  const cfg = buildConfig(); if (!cfg.goal) delete cfg.goal;
  clearDraft();
  if (WZ.d.motion !== S.motion) setMotion(WZ.d.motion);
  P.forEach(p => { if (WZ.d.places[p] !== placeOf(p)) { S.picnic[p] = {...(S.picnic[p]||{}), place:WZ.d.places[p]}; queuePicnic(p); } });
  S.config = cfg; widenForGoal(); render();
  markSaving();
  try { await store.setConfig(cfg); markSaved(); } catch (e) { markSaved(false); handleWriteError(e); }
}
function go(n){ if (WZ.editing) saveWizard(); const list = steps(); const j = Math.max(0, Math.min(list.length-1, n)); WZ.dir = j >= WZ.i ? 1 : -1; WZ.i = j; WZ.anim = true; drawWizard(); wiz.querySelector(".wbody").scrollTop = 0; }
wiz.addEventListener("click", e => {
  const b = e.target.closest("[data-w]"); if (!b) return;
  const a = b.dataset.w, d = D(), i = +b.dataset.i, p = b.dataset.p, v = b.dataset.v;
  switch(a){
    case "next": go(WZ.i+1); return;
    case "back": go(WZ.i-1); return;
    case "goto": go(i); return;
    case "cancel": wiz.close(); return;
    case "save": saveWizard(); wiz.close(); return;
    case "startover": clearDraft(); WZ.d = null; wiz.close(); openWizard("welcome"); return;
    case "finish": saveWizard(); go(WZ.i+1); return;
    case "close": wiz.close(); return;
    case "pron": d.people[p].pron = v; break;
    case "pet": d.people[p].pet = v; break;
    case "skiplooks": go(steps().findIndex(s => s.id==="goals")); return;
    case "whomode": WZ.whoMode = v; if (v==="all") d.habits.forEach(h => h.who = "both"); break;
    case "cat": WZ.cat[p] = v; break;
    case "av": d.people[p].avatar = {...d.people[p].avatar, [b.dataset.k]:v}; break;
    case "surprise": d.people[p].avatar = randomAvatar(); break;
    case "pick": { const sug = SUGGESTIONS[i], ix = d.habits.findIndex(h => h.name.toLowerCase()===sug.name.toLowerCase()); if (ix>=0) d.habits.splice(ix,1); else d.habits.push({...sug, item:CATS[sug.cat].icon, id:newId(), who:"both", share:"each", plant:PLANT_KINDS[d.habits.length%6]}); break; }
    case "rmgoal": d.habits.splice(i,1); break;
    case "owntype": WZ.ownType = v; break;
    case "addown": { const inp = document.getElementById("ownName"), n = (inp?.value||"").trim(); if (!n) { inp?.focus(); return; } const tp = WZ.ownType||"check"; d.habits.push({id:newId(), name:n, type:tp, dir:tp==="duration"?"min":"max", target:tp==="duration"?30:tp==="clock"?1380:0, cat:guessCat(n), item:CATS[guessCat(n)].icon, who:"both", share:"each", plant:PLANT_KINDS[d.habits.length%6]}); break; }
    case "who": d.habits[i].who = v; break;
    case "share": d.habits[i].share = v; break;
    case "dir": d.habits[i].dir = v; break;
    case "step": d.habits[i].target = Math.max(5, Math.min(1440, (Number(d.habits[i].target)||0) + Number(v))); break;
    case "icon": { const keys = Object.keys(CATS), k = keys.indexOf(d.habits[i].cat); d.habits[i].cat = keys[(k+1)%keys.length]; d.habits[i].item = CATS[d.habits[i].cat].icon; break; }
    case "idea": d.goal.text = v; break;
    case "len": { d.goal.len = v; const L = LENS.find(x=>x[0]===v); d.goal.start = d.goal.start || today(); if (L && L[2]!=null) d.goal.end = addDays(d.goal.start < today() ? d.goal.start : today(), L[2]); break; }
    case "city": d.places[p] = CITIES[v].spots[0]; break;
    case "spot": d.places[p] = v; break;
    case "season": d.season = v; break;
    case "pref": d.prefs[b.dataset.k] = v==="true" ? true : v==="false" ? false : v; break;
    case "motion": d.motion = v; break;
    default: return;
  }
  drawWizard();
});
wiz.addEventListener("input", e => {
  const t = e.target, f = t.dataset.wf, d = D(); if (!f) return;
  clearTimeout(WZ.dt); WZ.dt = setTimeout(() => { if (!WZ.editing) persistDraft(); }, 400);
  if (f==="name") { d.people[t.dataset.p].name = t.value; return; }
  if (f==="hname") { d.habits[+t.dataset.i].name = t.value; return; }
  if (f==="style") { d.habits[+t.dataset.i].style = t.value; return; }
  if (f==="clock") { const m = parseClock(t.value); if (m!=null) d.habits[+t.dataset.i].target = m; return; }
  if (f==="gtext") { d.goal.text = t.value; wiz.querySelectorAll('[data-w="idea"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v===t.value)); return; }
  if (f==="gwhy") { d.goal.why = t.value; return; }
  if (f==="gend") { if (t.value) d.goal.end = t.value; const el = document.getElementById("ambtxt"); if (el) el.innerHTML = `${d.goal.ambition}% of everything possible, which is <b>${goalCount()}</b> daily goals met together by ${esc(shortDate(d.goal.end))}.`; return; }
  if (f==="amb") { d.goal.ambition = +t.value; const el = document.getElementById("ambtxt"); if (el) el.innerHTML = `${d.goal.ambition}% of everything possible, which is <b>${goalCount()}</b> daily goals met together by ${esc(shortDate(d.goal.end))}.`; return; }
  if (f==="checkinBy") { const m = parseClock(t.value); if (m!=null) d.prefs.checkinBy = m; return; }
});
wiz.addEventListener("keydown", e => {
  if (e.key==="Enter" && e.target.id==="ownName") { e.preventDefault(); wiz.querySelector('[data-w="addown"]').click(); }
  else if (e.key==="Enter" && e.target.matches("input.bigin")) { e.preventDefault(); const n = wiz.querySelector('[data-w="next"],[data-w="finish"]'); n?.click(); }
});
wiz.addEventListener("cancel", e => { if (!WZ.editing && !S.config) { e.preventDefault(); return; } if (WZ.editing) saveWizard(); });

/* ---------- events ---------- */
const tabs = ["day","cal","garden"];
function showTab(t){ S.tab = t; saveUI(); tabs.forEach(x => { const b = document.getElementById("t-"+x); b.setAttribute("aria-selected", x===t); b.tabIndex = x===t?0:-1; document.getElementById("p-"+x).hidden = x!==t; }); }
tabs.forEach((t,i) => {
  const b = document.getElementById("t-"+t);
  b.addEventListener("click", () => showTab(t));
  b.addEventListener("keydown", e => { if (e.key==="ArrowRight"||e.key==="ArrowLeft") { const n = tabs[(i+(e.key==="ArrowRight"?1:2))%3]; showTab(n); document.getElementById("t-"+n).focus(); } });
});
document.getElementById("openSettings").addEventListener("click", () => openWizard(S.config ? "names" : "welcome"));
function shiftMonth(n){ const [y,m] = S.month.split("-").map(Number), d = new Date(y,m-1+n,1); S.month = d.getFullYear()+"-"+pad(d.getMonth()+1); widen(S.month+"-01"); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a==="toggle") { S.focus = {...(S.focus||{}), [b.dataset.p]:b.dataset.h}; toggle(b.dataset.d, b.dataset.p, b.dataset.h); }
  else if (a==="wiz") openWizard(b.dataset.step);
  else if (a==="shop") { shopP = b.dataset.p; drawShop(); shop.showModal(); }
  else if (a==="me") setMe(b.dataset.p);
  else if (a==="focus") { S.focus = {...(S.focus||{}), [b.dataset.p]:b.dataset.h}; saveUI(); render(); }
  else if (a==="note") { S.noteOpen = {...(S.noteOpen||{}), [b.dataset.p]:true}; saveUI(); render(); document.getElementById("note-"+b.dataset.p)?.focus(); }
  else if (a==="moremsgs") { S.showAllMsgs = true; render(); }
  else if (a==="quick") { const k = QUICK[b.dataset.kind]; if (k && S.me) sendMessage(b.dataset.kind, k.text(name(other(S.me)))); }
  else if (a==="send") { const inp = document.getElementById("msgText"); const v = inp?.value || ""; if (inp) inp.value = ""; sendMessage("note", v); }
  else if (a==="prevday") { S.day = addDays(S.day,-1); widen(S.day); S.month = S.day.slice(0,7); render(); }
  else if (a==="nextday") { if (S.day < today()) S.day = addDays(S.day,1); S.month = S.day.slice(0,7); render(); }
  else if (a==="gotoday") { S.day = today(); S.month = S.day.slice(0,7); render(); }
  else if (a==="prevmonth") { shiftMonth(-1); render(); }
  else if (a==="nextmonth") { shiftMonth(1); render(); }
  else if (a==="openday") { S.day = b.dataset.d; render(); showTab("day"); window.scrollTo({top:document.querySelector("nav.tabs").offsetTop-8, behavior:"smooth"}); }
});
document.addEventListener("input", e => { if (e.target.id==="msgText") { try { localStorage.setItem("habitus-msg-draft", e.target.value); } catch {} } });
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.id==="msgText") { e.preventDefault(); const v = e.target.value; e.target.value = ""; sendMessage("note", v); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.closest("#wizard")) return;
  if (t.matches("textarea[data-note]")) editText(t.dataset.d, t.dataset.p, "note", null, t.value);
  else if (t.matches("input[data-why]")) editText(t.dataset.d, t.dataset.p, "why", t.dataset.h, t.value);
  else if (t.matches("input[data-num]")) { const n = parseFloat(String(t.value).replace(",",".")); setRaw(t.dataset.d, t.dataset.p, t.dataset.h, t.value===""||isNaN(n) ? null : Math.max(0, Math.min(n,1e5))); }
  else if (t.matches("input[data-clock]")) setRaw(t.dataset.d, t.dataset.p, t.dataset.h, parseClock(t.value));
  else if (t.matches("input[data-dur]")) {
    const wrap = t.closest(".durin"), hh = wrap.querySelector('[data-dur="h"]').value, mm = wrap.querySelector('[data-dur="m"]').value;
    setRaw(t.dataset.d, t.dataset.p, t.dataset.h, hh==="" && mm==="" ? null : Math.min(1440, (Number(hh)||0)*60 + (Number(mm)||0)));
  }
});
loadUI(); applyMotion(); showTab(S.tab||"day"); render(); boot();
})();

</script>
